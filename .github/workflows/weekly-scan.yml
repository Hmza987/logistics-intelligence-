name: Climate Signal Scan

on:
  schedule:
    - cron: '0 5 * * 1,4'   # Monday + Thursday 05:00 UTC (twice a week)
  workflow_dispatch:          # Manual trigger from GitHub UI → Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # Needed to commit + push updated data file

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify API key is set
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "❌  ANTHROPIC_API_KEY secret is not set in this repository."
            echo "    Go to: Repository → Settings → Secrets and variables → Actions → New repository secret"
            echo "    Name: ANTHROPIC_API_KEY   Value: your sk-ant-... key"
            exit 1
          fi
          echo "✓ ANTHROPIC_API_KEY is set (${#ANTHROPIC_API_KEY} chars)"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Run climate signal scanner
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node poc/climate-scanner.js

      - name: Commit updated signals (if data changed)
        run: |
          git config user.name  "GCC Signal Bot"
          git config user.email "signal-bot@gcc-logistics.io"
          git add data/climate-signals-latest.json
          if git diff --staged --quiet; then
            echo "No signal changes — skipping commit"
          else
            git commit -m "auto: climate signal scan $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi
